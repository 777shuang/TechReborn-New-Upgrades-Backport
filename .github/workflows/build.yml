# Automatically build the project and run any configured tests for every push
# and submitted pull request.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
        
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: build
        uses: burrunan/gradle-cache-action@v3
        with:
          arguments: build

      - name: stage mod for runtime test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run/mods

          # Stage the built mod, excluding sources and javadoc jars.
          find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' \
            -exec cp {} run/mods/ \;

          # These are the exact Modrinth versions already declared by build.gradle.
          curl --fail --location --retry 3 \
            'https://api.modrinth.com/v2/version/QtkC5plA' \
            --output techreborn-version.json
          curl --fail --location --retry 3 \
            'https://api.modrinth.com/v2/version/qpctXwwN' \
            --output reborncore-version.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import Request, urlopen

          out = Path("run/mods")
          for metadata_file in ("techreborn-version.json", "reborncore-version.json"):
              metadata = json.loads(Path(metadata_file).read_text())
              candidates = [
                  f for f in metadata.get("files", [])
                  if f.get("primary") and f.get("url", "").endswith(".jar")
              ]
              if not candidates:
                  candidates = [
                      f for f in metadata.get("files", [])
                      if f.get("url", "").endswith(".jar")
                  ]
              if not candidates:
                  raise SystemExit(f"No jar download found in {metadata_file}")
              item = candidates[0]
              request = Request(item["url"], headers={"User-Agent": "TechReborn-New-Upgrades-Backport-CI/1.0"})
              with urlopen(request, timeout=60) as response:
                  data = response.read()
              expected = item.get("size")
              if expected is not None and len(data) != expected:
                  raise SystemExit(f"Unexpected download size for {item['filename']}")
              (out / item["filename"]).write_bytes(data)
              print(f"Staged {item['filename']} ({len(data)} bytes)")
          PY

          echo "Staged runtime mods:"
          find run/mods -maxdepth 1 -type f -printf '%f\n' | sort

      - name: run Minecraft client
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: '1.21.1'
          modloader: fabric
          java: '21'
          mc-runtime-test: fabric
          fabric-api: '0.116.12'
          dummy-assets: 'true'
          xvfb: 'true'
          cache-mc: 'github'

      - name: capture build and runtime-test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Minecraft-runtime-test
          path: |
            run/logs/
            run/crash-reports/
          if-no-files-found: warn

      - name: capture build and runtime-test artifacts
        uses: actions/upload-artifact@v7
        with:
          path: build/libs/*.jar
